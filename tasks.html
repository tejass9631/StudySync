<!DOCTYPE html>

<button class="back-btn" onclick="goBack()">⬅ Back</button> <head>
  <title>Tasks</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 🌌 BACKGROUND (SPACE ANIMATION) */
   body {
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, #0a0a0a);
  color: white;
  overflow-x: hidden;
}

/* ⭐ stars layer */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 200%;
  height: 200%;
  background: url("https://www.transparenttextures.com/patterns/stardust.png");
  animation: starsMove 120s linear infinite;
  opacity: 0.6;   /* 👈 increase kiya visibility ke liye */
  z-index: -1;
}

/* ✨ extra glow layer */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
  z-index: -1;
}

@keyframes starsMove {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(-1000px);
  }
}

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 26px;
    }

    /* 📦 CONTAINER */
    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      padding: 30px 60px;
      width: 100%;
    }

    /* 📱 mobile */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }

    /* 🧊 CARD (GLASS UI) */
    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 6px 25px rgba(0,0,0,0.4);
      height: 420px;
      overflow-y: auto;
      transition: 0.25s;
    }

    .card {
  background: rgba(255, 255, 255, 0.12); /* thoda bright */
}

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 6px;
    }

    /* ✅ TASK */
    .task {
      display: flex;
      align-items: center;
      font-size: 14px;
      padding: 6px 0;
      cursor: pointer;
    }

    .task input {
      margin-right: 10px;
      transform: scale(1.1);
      cursor: pointer;
    }

    /* scrollbar */
    .card::-webkit-scrollbar {
      width: 5px;
    }

    .card::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
    }

    .back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: white;
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: 0.2s;
}

.back-btn:hover {
  background: rgba(255,255,255,0.3);
}

  </style>
</head>
